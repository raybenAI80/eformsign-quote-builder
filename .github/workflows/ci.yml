# 견적서 빌더 기본 검사. PR 과 main push 마다 타입·단위 테스트·정적 회귀 검사(src/__guards__)·빌드를 돈다.
# 비밀값은 쓰지 않는다. 브라우저 검증(npm run verify:export)은 여기서 돌리지 않는다 — skills/quote-builder-state-flow/references/export-pipeline.md 5절 참조.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 단위 테스트와 정적 회귀 검사
        run: npx vitest run
      - name: 빌드
        run: npm run build
